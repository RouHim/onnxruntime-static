name: Build static ONNX Runtime

on:
  pull_request:
    paths:
      - "ort.env"
      - "cmake/**"
      - "patches/**"
      - "scripts/**"
      - "smoke/**"
      - "images/**"
      - "tests/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "ort.env"
      - "cmake/**"
      - "patches/**"
      - "scripts/**"
      - "smoke/**"
      - "images/**"
      - "tests/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "ONNX Runtime version (defaults to ort.env)"
        required: false
        type: string
      publish:
        description: "Publish a GitHub release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
          scripts/*.sh scripts/ci/*.sh tests/*.sh
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Shell tests
        run: sh tests/run.sh
      - name: Validate Renovate config
        run: jq empty renovate.json

  resolve:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=$(sh scripts/resolve-version.sh "$INPUT_VERSION")
          else
            version=$(sh scripts/resolve-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building ONNX Runtime $version"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            dockerfile: images/alpine.Dockerfile
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            dockerfile: images/alpine.Dockerfile
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            dockerfile: images/ubuntu.Dockerfile
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t ort-build .
      - name: Build and smoke
        env:
          ORT_VERSION: ${{ needs.resolve.outputs.version }}
          ORT_GIT_URL: https://gitcode.com/GitHub_Trending/on/onnxruntime.git
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e ORT_VERSION \
            -e ORT_GIT_URL \
            ort-build sh scripts/ci/build-in-container.sh "${{ matrix.target }}"
      - name: Package
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          sh scripts/package.sh \
            "${{ needs.resolve.outputs.version }}" \
            "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.zst
          if-no-files-found: error

  preflight:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            dockerfile: images/preflight-x86_64.Dockerfile
          - target: aarch64-unknown-linux-musl
            dockerfile: images/preflight-aarch64.Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: dist
      - name: Link with the consumer toolchain
        env:
          ORT_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker build -f "${{ matrix.dockerfile }}" -t ort-preflight .
          docker run --rm -v "$PWD:/src" -w /src -e ORT_VERSION ort-preflight \
            sh scripts/ci/preflight.sh "${{ matrix.target }}"

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [resolve, build, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-linux-*"
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.zst > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.zst"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if gh release view "v$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "deleting incomplete draft release v$VERSION"
            gh release delete "v$VERSION" --yes
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; nothing to publish"
            exit 0
          fi
          gh release create "v$VERSION" --draft \
            --title "ONNX Runtime $VERSION static builds" \
            --notes "Static CPU builds of ONNX Runtime $VERSION for x86_64 GNU, x86_64 musl, and aarch64 musl. Assets are SHA-256 pinned in SHA256SUMS."
          gh release upload "v$VERSION" dist/*.tar.zst dist/SHA256SUMS
          gh release edit "v$VERSION" --draft=false
